services:
  - type: web
    name: kommo-agente
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DB_PATH
        value: /data/conversations.db
      - key: KOMMO_SUBDOMAIN
        sync: false
      - key: KOMMO_API_TOKEN
        sync: false
      - key: KOMMO_BOT_USER_ID
        sync: false
      - key: KOMMO_STAGE_MAP
        value: "{}"
      - key: AI_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: WEBHOOK_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: MAX_HISTORY_TURNS
        value: "20"
      - key: HUMAN_TIMEOUT_HOURS
        value: "4"
      - key: BOT_TIMEOUT_MINUTES
        value: "3"
    disk:
      name: kommo-data
      mountPath: /data
      sizeGB: 1
